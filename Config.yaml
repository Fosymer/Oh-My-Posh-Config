cache:
  - duration: none
final_space: true
patch_pwsh_bleed: true
shell_integration: true
version: 3
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: path
        style: powerline
        powerline_symbol: ""
        foreground: "#ffffff"
        background: "#0077be"
        properties:
          style: folder
          max_depth: 3
      - type: git
        style: powerline
        powerline_symbol: ""
        foreground: "#ffffff"
        background: "#28a745"
        properties:
          display_status: true
          display_stash_count: true
      - type: status
        style: diamond
        leading_diamond: ""
        trailing_diamond: ""
        foreground: "#ffffff"
        background: "#d50000"
        display_exit_code: false
        properties:
          display_exit_code: false
        templates:
          error: "✗"
          success: "✓"
